name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # CI is local-class (ADR-034): it never holds staging or production
      # credentials, and no hosted Supabase project is connected.
      VENUBOARD_ENV: local

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      - name: Production build
        run: npm run build

# End-to-end tests deliberately stay out of CI until the preview and
# test-database strategy is accepted (OQ-38). Database security tests
# (migrations, seed, pgTAP, generated types) run in
# `.github/workflows/database.yml` against repository-local Docker Supabase.
# That workflow never logs into or links a hosted project.
