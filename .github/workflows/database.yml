name: Database security

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/seed/**"
      - "supabase/tests/**"
      - "supabase/config.toml"
      - "src/core/db/types.ts"
      - "src/core/test-stack/**"
      - "scripts/db-*.mts"
      - "scripts/test-*.mts"
      - "scripts/lib/local-supabase.mts"
      - "scripts/lib/run-bin.mts"
      - "scripts/lib/test-stack/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/database.yml"

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-security:
    name: Isolated Supabase migrations, seed, pgTAP, types
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # CI is local-class (ADR-034). No hosted project, no login, no link.
      # Isolated tooling sets test identity for the throwaway runner stack.
      VENUBOARD_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start isolated test Supabase
        run: npm run test:stack:start

      - name: Reset isolated test database (migrations + seed)
        run: npm run test:stack:reset

      - name: Run pgTAP / database tests
        run: npm run test:db

      - name: Generated types must match the committed file
        run: npm run test:types:check

      - name: Stop isolated test Supabase
        if: always()
        run: npm run test:stack:stop
